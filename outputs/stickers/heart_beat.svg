<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="hGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="60%" stop-color="#e60039"/>
      <stop offset="100%" stop-color="#990026"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff0040" flood-opacity="0.5"/>
    </filter>
  </defs>
  <style>
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.18); }
      28% { transform: scale(1); }
      42% { transform: scale(1.28); }
      70% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    .heart-group { transform-origin: 50px 52px; animation: heartbeat 1.1s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
  </style>
  <g class="heart-group" filter="url(#glow)">
    <path fill="url(#hGrad)" d="M50 88 C20 62 4 44 4 28 C4 13 15 4 28 4 C37 4 45 9 50 16 C55 9 63 4 72 4 C85 4 96 13 96 28 C96 44 80 62 50 88 Z"/>
    <ellipse cx="32" cy="20" rx="9" ry="5" fill="#ffffff" opacity="0.45" transform="rotate(-30 32 20)"/>
  </g>
</svg>