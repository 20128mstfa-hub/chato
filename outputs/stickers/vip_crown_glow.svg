<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="rubyGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <radialGradient id="emeraldGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes crownFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.3; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .crown-body { transform-origin: 50px 60px; animation: crownFloat 2s ease-in-out infinite; }
    .star-1 { transform-origin: 20px 22px; animation: shimmer 1.5s ease-in-out infinite; }
    .star-2 { transform-origin: 80px 24px; animation: shimmer 1.7s ease-in-out 0.4s infinite; }
  </style>
  <g class="crown-body">
    <!-- Base crown -->
    <path d="M12 70 L20 30 L40 50 L50 20 L60 50 L80 30 L88 70 Z" fill="url(#goldCrown)" stroke="#713f12" stroke-width="2" stroke-linejoin="round"/>
    <rect x="12" y="70" width="76" height="14" rx="4" fill="url(#goldCrown)" stroke="#713f12" stroke-width="2"/>
    <!-- Jewels on tips -->
    <circle cx="20" cy="28" r="5" fill="url(#rubyGrad)"/>
    <circle cx="50" cy="18" r="6.5" fill="url(#emeraldGrad)"/>
    <circle cx="80" cy="28" r="5" fill="url(#rubyGrad)"/>
    <!-- Base jewels -->
    <circle cx="28" cy="77" r="3.5" fill="url(#rubyGrad)"/>
    <circle cx="50" cy="77" r="4.5" fill="#38bdf8"/>
    <circle cx="72" cy="77" r="3.5" fill="url(#emeraldGrad)"/>
  </g>
  <!-- Sparkles -->
  <polygon class="star-1" points="20,15 22,20 27,22 22,24 20,29 18,24 13,22 18,20" fill="#fde047"/>
  <polygon class="star-2" points="80,18 82,23 87,25 82,27 80,32 78,27 73,25 78,23" fill="#ffffff"/>
</svg>