<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes coneShake {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      50% { transform: rotate(-8deg) translate(-2px, 2px); }
    }
    @keyframes confettiFly {
      0% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      50% { opacity: 1; transform: translate(12px, -15px) scale(1.1); }
      100% { opacity: 0; transform: translate(20px, -26px) scale(0.8); }
    }
    .cone { transform-origin: 25px 80px; animation: coneShake 0.7s ease-in-out infinite; }
    .confetti { animation: confettiFly 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
  </style>
  <g class="cone">
    <polygon points="15,85 28,45 68,75" fill="url(#coneGrad)" stroke="#92400e" stroke-width="2"/>
    <path d="M28 45 Q48 60 68 75" stroke="#ef4444" stroke-width="5" fill="none"/>
    <path d="M22 62 Q38 72 52 82" stroke="#3b82f6" stroke-width="4" fill="none"/>
  </g>
  <g class="confetti">
    <circle cx="55" cy="35" r="4" fill="#ec4899"/>
    <circle cx="75" cy="45" r="3.5" fill="#3b82f6"/>
    <rect x="62" y="18" width="7" height="4" fill="#10b981" rx="1" transform="rotate(25 65 20)"/>
    <rect x="42" y="24" width="6" height="4" fill="#8b5cf6" rx="1" transform="rotate(-35 45 26)"/>
    <circle cx="82" cy="28" r="4.5" fill="#f59e0b"/>
  </g>
</svg>