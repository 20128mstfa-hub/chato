<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fireOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="fireInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes flameFlicker {
      0%, 100% { transform: scaleY(1) scaleX(1) skewX(0deg); }
      25% { transform: scaleY(1.08) scaleX(0.95) skewX(3deg); }
      50% { transform: scaleY(0.96) scaleX(1.04) skewX(-2deg); }
      75% { transform: scaleY(1.05) scaleX(0.98) skewX(2deg); }
    }
    @keyframes innerFlicker {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(1.15) scaleX(0.92); }
    }
    .flame-main { transform-origin: 50px 92px; animation: flameFlicker 0.6s ease-in-out infinite; }
    .flame-core { transform-origin: 50px 92px; animation: innerFlicker 0.45s ease-in-out infinite; }
  </style>
  <g class="flame-main">
    <path d="M50 4 C58 24 74 34 82 52 C90 70 82 92 50 94 C18 92 10 70 18 52 C24 38 32 30 38 18 C42 32 50 40 46 54 C54 44 52 26 50 4 Z" fill="url(#fireOuter)"/>
  </g>
  <g class="flame-core">
    <path d="M50 36 C55 48 64 56 68 68 C72 80 66 90 50 90 C34 90 28 80 32 68 C36 58 42 54 46 44 C48 52 52 56 50 64 C53 58 52 46 50 36 Z" fill="url(#fireInner)"/>
  </g>
</svg>